name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  JAVA_TOOL_OPTIONS: "-Xmx1g"
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_REGION: us-east-1

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Build Maven projects (sin integración)
        run: mvn -B -DskipITs=true package

  docker-build-push:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # CARRITO
      - name: Build & push carrito-microservice
        uses: docker/build-push-action@v4
        with:
          context: carrito-microservice
          file: carrito-microservice/Dockerfile
          push: true
          tags: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/carrito-microservice:latest

      # CORE
      - name: Build & push core-microservice
        uses: docker/build-push-action@v4
        with:
          context: core-microservice
          file: core-microservice/Dockerfile
          push: true
          tags: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/core-microservice:latest

      # USUARIO
      - name: Build & push usuario-microservice
        uses: docker/build-push-action@v4
        with:
          context: usuario-microservice
          file: usuario-microservice/Dockerfile
          push: true
          tags: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/usuario-microservice:latest

  deploy-aws:
    needs: docker-build-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: infra

      - name: Install AWS CLI
        run: |
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip awscliv2.zip
          sudo ./aws/install

      - name: Test SQS
        run: |
          aws sqs send-message \
            --queue-url https://sqs.us-east-1.amazonaws.com/386667539008/HuertoHogar \
            --message-body "CI/CD test message"

      - name: Deploy Lambda
        run: |
          aws lambda update-function-code \
            --function-name huertohogar-function \
            --zip-file fileb://infra/lambda/huertohogar.zip
