name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  JAVA_TOOL_OPTIONS: "-Xmx1g"
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_REGION: us-east-1
  QUEUE_URL: ${{ secrets.QUEUE_URL }}

jobs:

  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Build all microservices (Maven)
        run: mvn -B -DskipTests=true clean package


  docker-build-push:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push carrito-microservice
        uses: docker/build-push-action@v4
        with:
          context: carrito-microservice
          file: carrito-microservice/Dockerfile
          push: true
          tags: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/carrito-microservice:latest

      - name: Build & Push core-microservice
        uses: docker/build-push-action@v4
        with:
          context: core-microservice
          file: core-microservice/Dockerfile
          push: true
          tags: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/core-microservice:latest

      - name: Build & Push usuario-microservice
        uses: docker/build-push-action@v4
        with:
          context: usuario-microservice
          file: usuario-microservice/Dockerfile
          push: true
          tags: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/usuario-microservice:latest


  deploy-aws:
    needs: docker-build-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate AWS CLI install
        run: aws --version

      - name: Test SQS connection
        run: |
          aws sqs send-message \
            --queue-url ${{ env.QUEUE_URL }} \
            --message-body "CI/CD test message from GitHub Actions"

      - name: Deploy Lambda function
        run: |
          aws lambda update-function-code \
            --function-name procesar_sqs_lambda \
            --zip-file fileb://infra/terraform/lambda/huertohogar.zip